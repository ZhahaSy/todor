# 宿主机 Nginx（监听 80）→ 反代到 Docker chat-ui（映射到本机 8080）
# 使用方式：复制到 /etc/nginx/conf.d/ 或 sites-enabled/，改 server_name，nginx -t && systemctl reload nginx
#
# 前置：/opt/my-turborepo/deploy/.env 中有 CHAT_UI_HOST_PORT=8080，且 compose 已 up。

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 换成你的域名，例如 chat.example.com

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
