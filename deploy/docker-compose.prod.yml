name: my-turborepo

# ECS 上由 deploy 写入 .env：
#   IMAGE_BASE=ghcr.io/<owner>  或  registry.cn-<region>.aliyuncs.com/<命名空间>
#   IMAGE_TAG=<commit SHA 或 latest>

services:
  chat-service:
    image: ${IMAGE_BASE}/chat-service:${IMAGE_TAG:-latest}
    container_name: chat-service
    restart: unless-stopped
    env_file:
      - ./chat-service.env
    volumes:
      - /opt/my-turborepo/data/chat-service:/var/data/chat-service
    networks:
      - app-net

  chat-ui:
    image: ${IMAGE_BASE}/chat-ui:${IMAGE_TAG:-latest}
    container_name: chat-ui
    restart: unless-stopped
    depends_on:
      - chat-service
    ports:
      - "80:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
