name: my-turborepo

# ECS 上 deploy/.env 示例：
#   IMAGE_BASE=...
#   IMAGE_TAG=...
#   CHAT_UI_HOST_PORT=80   # 宿主若已占用 80，改为 8080 等

services:
  chat-service:
    image: ${IMAGE_BASE}/chat-service:${IMAGE_TAG:-latest}
    container_name: chat-service
    restart: unless-stopped
    env_file:
      - ./chat-service.env
    volumes:
      - /opt/my-turborepo/data/chat-service:/var/data/chat-service
    networks:
      - app-net

  chat-ui:
    image: ${IMAGE_BASE}/chat-ui:${IMAGE_TAG:-latest}
    container_name: chat-ui
    restart: unless-stopped
    depends_on:
      - chat-service
    ports:
      - "${CHAT_UI_HOST_PORT:-80}:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
