name: my-turborepo

# ECS 上 deploy/.env 示例：
#   IMAGE_BASE=...
#   IMAGE_TAG=...
#   CHAT_UI_HOST_PORT=8080 # 默认见下方；无宿主机 Nginx 且要写死 80 时可设 CHAT_UI_HOST_PORT=80

services:
  chat-service:
    image: ${IMAGE_BASE}/chat-service:${IMAGE_TAG:-latest}
    container_name: chat-service
    restart: unless-stopped
    env_file:
      - ./chat-service.env
    volumes:
      - /opt/my-turborepo/data/chat-service:/var/data/chat-service
    networks:
      - app-net

  chat-ui:
    image: ${IMAGE_BASE}/chat-ui:${IMAGE_TAG:-latest}
    container_name: chat-ui
    restart: unless-stopped
    depends_on:
      - chat-service
    ports:
      # 默认 8080，避免与宿主机 Nginx 抢 80；需要容器直连宿主 80 时在 .env 写 CHAT_UI_HOST_PORT=80
      - "${CHAT_UI_HOST_PORT:-8080}:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
