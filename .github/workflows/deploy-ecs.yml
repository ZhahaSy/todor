name: Deploy To ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 推 ghcr +（可选）推 ACR 时层较大，避免默认上限过早失败
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：配置后同一镜像会同时推送到阿里云 ACR，ECS 走同地域拉取，避免跨境拉 ghcr 很慢
      - name: Login to ACR (optional)
        if: ${{ secrets.ACR_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute tags — chat-service
        id: tag_svc
        run: |
          O="${{ steps.vars.outputs.owner_lc }}"
          S="${{ github.sha }}"
          {
            echo "tags<<__EOT__"
            echo "ghcr.io/${O}/chat-service:latest"
            echo "ghcr.io/${O}/chat-service:${S}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              R="${{ secrets.ACR_REGISTRY }}"
              N="${{ secrets.ACR_NAMESPACE }}"
              echo "${R}/${N}/chat-service:latest"
              echo "${R}/${N}/chat-service:${S}"
            fi
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags — chat-ui
        id: tag_ui
        run: |
          O="${{ steps.vars.outputs.owner_lc }}"
          S="${{ github.sha }}"
          {
            echo "tags<<__EOT__"
            echo "ghcr.io/${O}/chat-ui:latest"
            echo "ghcr.io/${O}/chat-ui:${S}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              R="${{ secrets.ACR_REGISTRY }}"
              N="${{ secrets.ACR_NAMESPACE }}"
              echo "${R}/${N}/chat-ui:latest"
              echo "${R}/${N}/chat-ui:${S}"
            fi
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push chat-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ steps.tag_svc.outputs.tags }}

      - name: Build and push chat-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-ui/Dockerfile
          push: true
          tags: ${{ steps.tag_ui.outputs.tags }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # SSH 内执行 pull 可能久于 10 分钟（跨境或大层），与 command_timeout 对齐
    timeout-minutes: 90
    steps:
      # 只拉 deploy/，避免整仓 clone（大 monorepo 时 checkout 会占掉大量“部署前”时间）
      - name: Checkout (deploy files only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Prepare lowercase image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Upload compose file to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 2m
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/my-turborepo/deploy"
          strip_components: 1

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 2m
          command_timeout: 60m
          script: |
            set -e

            mkdir -p /opt/my-turborepo/deploy
            mkdir -p /opt/my-turborepo/data/chat-service

            if [ ! -f /opt/my-turborepo/deploy/chat-service.env ]; then
              echo "Missing /opt/my-turborepo/deploy/chat-service.env"
              exit 1
            fi

            IMAGE_BASE="ghcr.io/${{ steps.vars.outputs.owner_lc }}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              IMAGE_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}"
            fi
            printf 'IMAGE_BASE=%s\nIMAGE_TAG=%s\n' "$IMAGE_BASE" "${{ github.sha }}" > /opt/my-turborepo/deploy/.env

            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            else
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            cd /opt/my-turborepo/deploy

            # 拉大/慢链路下 compose 与 client 等待时间，减少「其实在拉层但被误判超时」
            export COMPOSE_HTTP_TIMEOUT=600
            export DOCKER_CLIENT_TIMEOUT=600

            pull_ok=0
            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.prod.yml pull; then
                pull_ok=1
                break
              fi
              echo "[deploy] docker compose pull failed (attempt $attempt/5), retry in 60s..."
              sleep 60
            done
            if [ "$pull_ok" != 1 ]; then
              echo "[deploy] docker compose pull failed after retries"
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
