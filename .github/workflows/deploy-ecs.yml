name: Deploy To ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push chat-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-service:latest
            ghcr.io/${{ github.repository_owner }}/chat-service:${{ github.sha }}

      - name: Build and push chat-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-ui:latest
            ghcr.io/${{ github.repository_owner }}/chat-ui:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/my-turborepo/deploy"
          strip_components: 1

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            set -e

            mkdir -p /opt/my-turborepo/deploy
            mkdir -p /opt/my-turborepo/data/chat-service

            if [ ! -f /opt/my-turborepo/deploy/chat-service.env ]; then
              echo "Missing /opt/my-turborepo/deploy/chat-service.env"
              exit 1
            fi

            cat > /opt/my-turborepo/deploy/.env <<EOF
            GHCR_OWNER=${{ github.repository_owner }}
            IMAGE_TAG=${{ github.sha }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            cd /opt/my-turborepo/deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
