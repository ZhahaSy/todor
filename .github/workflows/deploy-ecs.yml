name: Deploy To ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 避免多次 push 时多个 workflow 并发部署同一台 ECS：后结束的 job 可能用「更早的 commit SHA」
# 覆盖 .env 里的 IMAGE_TAG，把线上镜像回滚成旧版本。
concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 推 ghcr +（可选）推 ACR 时层较大，避免默认上限过早失败
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 是否启用 ACR：if 条件里不能写 secrets.*（部分环境会报 Unrecognized named-value: 'secrets'）
      - name: Detect ACR secrets
        id: acr_cfg
        env:
          ACR_REGISTRY_SECRET: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [ -n "$ACR_REGISTRY_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # 可选：配置后同一镜像会同时推送到阿里云 ACR，ECS 走同地域拉取，避免跨境拉 ghcr 很慢
      - name: Login to ACR (optional)
        if: steps.acr_cfg.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute tags — chat-service
        id: tag_svc
        run: |
          O="${{ steps.vars.outputs.owner_lc }}"
          S="${{ github.sha }}"
          {
            echo "tags<<__EOT__"
            echo "ghcr.io/${O}/chat-service:latest"
            echo "ghcr.io/${O}/chat-service:${S}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              R="${{ secrets.ACR_REGISTRY }}"
              N="${{ secrets.ACR_NAMESPACE }}"
              echo "${R}/${N}/chat-service:latest"
              echo "${R}/${N}/chat-service:${S}"
            fi
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags — chat-ui
        id: tag_ui
        run: |
          O="${{ steps.vars.outputs.owner_lc }}"
          S="${{ github.sha }}"
          {
            echo "tags<<__EOT__"
            echo "ghcr.io/${O}/chat-ui:latest"
            echo "ghcr.io/${O}/chat-ui:${S}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              R="${{ secrets.ACR_REGISTRY }}"
              N="${{ secrets.ACR_NAMESPACE }}"
              echo "${R}/${N}/chat-ui:latest"
              echo "${R}/${N}/chat-ui:${S}"
            fi
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push chat-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ steps.tag_svc.outputs.tags }}

      - name: Build and push chat-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-ui/Dockerfile
          push: true
          tags: ${{ steps.tag_ui.outputs.tags }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # 须 ≥ SSH command_timeout，避免整 job 先被 GitHub 掐断
    timeout-minutes: 150
    steps:
      # 只拉 deploy/，避免整仓 clone（大 monorepo 时 checkout 会占掉大量“部署前”时间）
      - name: Checkout (deploy files only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Prepare lowercase image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Upload compose file to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 2m
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/my-turborepo/deploy"
          strip_components: 1

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 2m
          command_timeout: 120m
          script: |
            set -e

            mkdir -p /opt/my-turborepo/deploy
            mkdir -p /opt/my-turborepo/data/chat-service

            if [ ! -f /opt/my-turborepo/deploy/chat-service.env ]; then
              echo "Missing /opt/my-turborepo/deploy/chat-service.env"
              exit 1
            fi

            IMAGE_BASE="ghcr.io/${{ steps.vars.outputs.owner_lc }}"
            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              IMAGE_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}"
            fi
            # 更新镜像变量，并保留你在 ECS 上自定义的其它行（如 CHAT_UI_HOST_PORT）
            ENV_FILE=/opt/my-turborepo/deploy/.env
            TMP_KEEP=$(mktemp)
            if [ -f "$ENV_FILE" ]; then
              grep -vE '^(IMAGE_BASE|IMAGE_TAG)=' "$ENV_FILE" > "$TMP_KEEP" || true
            fi
            {
              printf 'IMAGE_BASE=%s\n' "$IMAGE_BASE"
              printf 'IMAGE_TAG=%s\n' "${{ github.sha }}"
              [ -s "$TMP_KEEP" ] && cat "$TMP_KEEP"
            } > "$ENV_FILE"
            rm -f "$TMP_KEEP"
            # 未配置时写入 8080，避免 chat-ui 默认绑宿主 80 与系统 Nginx 冲突
            if ! grep -qE '^CHAT_UI_HOST_PORT=' "$ENV_FILE"; then
              echo 'CHAT_UI_HOST_PORT=8080' >> "$ENV_FILE"
            fi

            if [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
              echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            else
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            cd /opt/my-turborepo/deploy
            echo "[deploy] $(grep -E '^CHAT_UI_HOST_PORT=' .env || true)"

            # Compose ↔ Docker 守护进程：单次 pull 慢时 600s 仍可能切断长连接；拉满避免「第一层快、后面卡死」误判
            export COMPOSE_HTTP_TIMEOUT=86400
            export DOCKER_CLIENT_TIMEOUT=86400
            # 部分版本下限制并发拉层，减少二张镜像并行时链路恶化
            export COMPOSE_PARALLEL_LIMIT=1

            pull_ok=0
            for attempt in 1 2 3 4 5; do
              # 按服务顺序拉：避免出现 chat-service 完成后与 chat-ui 并行、瞬时吞吐掉到几 KB/s 仍被 CLI 判超时
              if docker compose -f docker-compose.prod.yml pull chat-service \
                && docker compose -f docker-compose.prod.yml pull chat-ui \
                && docker compose -f docker-compose.prod.yml pull redis; then
                pull_ok=1
                break
              fi
              echo "[deploy] docker compose pull failed (attempt $attempt/5), retry in 60s..."
              sleep 60
            done
            if [ "$pull_ok" != 1 ]; then
              echo "[deploy] docker compose pull failed after retries"
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker image prune -f
